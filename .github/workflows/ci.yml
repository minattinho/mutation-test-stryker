name: Testes e Mutation Testing

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Testes unitários (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run coverage

  mutation-tests:
    name: Mutation testing (Stryker)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7
      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Falha o job se o mutation score ficar abaixo de thresholds.break (stryker.config.mjs)
      - run: npm run mutation
      - name: Publicar relatório HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/

  sonarcloud:
    name: Análise SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Gerar relatório de cobertura
        run: npm run coverage
      - name: Official SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
